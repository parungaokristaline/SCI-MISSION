<html lang="en"><head><meta charset="utf-8">

<title>SCI-MISSION: Science Investigation Missions</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#16213a;--mut:#5b6785;--line:#dde2ee;--pri:#3b5bdb;--acc:#f08c00;--ok:#2b9348;--soft:#eaeefc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--ink:#eef1fb;--mut:#a0abc9;--line:#2b365a;--pri:#7c93ff;--acc:#ffb340;--ok:#5fd37f;--soft:#202a4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--ink:#eef1fb;--mut:#a0abc9;--line:#2b365a;--pri:#7c93ff;--acc:#ffb340;--ok:#5fd37f;--soft:#202a4a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;padding:8px 14px;overflow-x:auto}
nav b{margin-right:auto;white-space:nowrap}nav button{white-space:nowrap}
button,select,textarea,input{font:inherit;color:inherit}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--soft);color:var(--pri);font-weight:600}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.hero{background:linear-gradient(135deg,#3b5bdb,#7048e8);color:#fff;border-radius:18px;padding:34px 24px}
.hero h1{margin:0 0 6px;font-size:clamp(28px,6vw,44px)}.hero p{margin:6px 0;max-width:640px}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--soft);color:var(--pri)}.btn:disabled{opacity:.45;cursor:not-allowed}
.hero .btn{background:#fff;color:#3b5bdb;margin:12px 8px 0 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{margin:30px 0 10px}h3{margin:0 0 6px}.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--soft);color:var(--pri);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin:2px 0}
.mc{cursor:pointer;transition:transform .15s}.mc:hover{transform:translateY(-3px)}.mc.done{border-color:var(--ok)}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.st{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer}
.st.on{background:var(--pri);color:#fff;border-color:var(--pri)}
textarea,input[type=text],input[type=number],select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:76px}label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px;text-align:left;font-size:14px}th{background:var(--soft)}
td input{border:0;background:transparent;padding:4px;min-width:70px}
.wrap{overflow-x:auto}.row{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.chain{display:flex;flex-wrap:wrap;gap:6px}.chain button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.chain button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.badge{font-size:38px;text-align:center;filter:grayscale(1);opacity:.35;transition:.4s}.badge.got{filter:none;opacity:1}
.q label{font-weight:400;display:flex;gap:8px;margin:4px 0;align-items:center}
.good{color:var(--ok);font-weight:600}.bad{color:#e03131;font-weight:600}
.note{border-left:4px solid var(--acc);background:var(--soft);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:14px}
@media print{nav,.btn,.row{display:none}}
</style></head><body>

home(){A.innerHTML=`<div class="hero"><span class="tag" style="background:#ffffff33;color:#fff">Junior High School Science</span><h1>SCI-MISSION</h1><p><b>Science Investigation Missions</b><br>A low-cost, mission-based experimental learning kit for Scientific Investigation, Data Interpretation and Chemical Reactions.</p><p><i>Investigate. Decode. Explain. Act.</i></p><button class="btn" id="go1">Start Mission 1 →</button><button class="btn" id="goM">See all missions</button></div>
<h2>How a mission works</h2><p class="mut">Learners don’t follow a recipe. They get a problem and must prove their answer with evidence. Click each link of the <b>Evidence Chain</b>:</p>
<div class="chain" id="ch"></div><div class="note" id="chx"></div>
<h2>The three competencies</h2><div class="grid">${["Scientific Investigation|Identify a problem, predict, identify variables, plan and safely conduct a simple investigation.|Missions 1–2","Data Interpretation|Organize data, find patterns and trends, read and build graphs, support conclusions with evidence.|Missions 3–4","Chemical Reactions|Identify observable evidence of chemical change and explain it with evidence.|Missions 5–6"].map(x=>{const p=x.split("|");return`<div class="card"><span class="tag">${p[2]}</span><h3>${p[0]}</h3><p class="mut">${p[1]}</p></div>`}).join("")}</div>
<h2>Built on Keller’s ARCS Model</h2><div class="grid">${[["A","Attention","A mystery or unusual observation sparks curiosity."],["R","Relevance","Everyday situations and household materials."],["C","Confidence","Guided questions, planning templates, gradual challenges."],["S","Satisfaction","Evidence, defended conclusions, feedback and badges."]].map(a=>`<div class="card"><h3 style="color:var(--acc)">${a[0]} · ${a[1]}</h3><p class="mut">${a[2]}</p></div>`).join("")}</div>
<h2>Inside the SCI-MISSION Box</h2><div class="grid"><div class="card"><h3>👩‍🏫 Teacher</h3><p class="mut">Mission Guide · Competency Matrix · ARCS Guide · Safety Guide · Facilitation Guide · Rubrics</p></div><div class="card"><h3>🎒 Learner</h3><p class="mut">Mission Passport · 6 Mission Cards · 6 Evidence Cards · Data Sheets · Reflection Sheets · Badge Cards</p></div><div class="card"><h3>🧪 Low-cost materials</h3><p class="mut">Vinegar · baking soda · ice · salt · cups · balloons · measuring tools · recycled items</p></div></div>
<h2>Your progress</h2><div class="card"><div class="bar"><i style="width:${done()/6*100}%"></i></div><p class="mut">${done()} of 6 missions complete</p></div>`;

const box=$("#ch");ch.forEach((c,i)=>{const b=document.createElement("button");b.textContent=(i+1)+". "+c[0];b.onclick=()=>{$$("button",box).forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#chx").innerHTML="<b>"+c[0]+":</b> "+c[1]};box.append(b)});box.firstChild.click();

passport(){A.innerHTML=`<h2 style="margin-top:0">My Science Mission Passport</h2><div class="card"><label>Name</label><input type="text" id="pn" value="${esc(S.name)}"><label>Grade / Section</label><input type="text" id="pg" value="${esc(S.grade)}"><label>Science Team</label><input type="text" id="pt" value="${esc(S.team)}"></div>

teacher(){A.innerHTML=`<h2 style="margin-top:0">Teacher’s Implementation Guide</h2><div class="grid">
<div class="card"><h3>1 · Before the mission</h3><ol><li>Introduce the mission story</li><li>Present the problem</li><li>Organize learners into teams</li><li>Distribute the Mission Card</li><li>Explain safety procedures</li><li>Provide the low-cost materials</li></ol></div>
<div class="card"><h3>2 · During the mission</h3><p class="mut">Don’t give the answer. Ask:</p><ul><li>What do you think will happen?</li><li>What evidence will you collect?</li><li>What are you changing? Keeping the same?</li><li>What does your data show?</li><li>Does the evidence support your prediction?</li></ul></div>
<div class="card"><h3>3 · After the mission</h3><ol><li>Evidence sharing</li><li>Group explanation</li><li>Compare results</li><li>Correct misconceptions</li><li>Reflection</li><li>Mission assessment</li><li>Award badges</li></ol></div></div>
<h2>Safety guidelines</h2><div class="note">Use eye protection for Missions 5–6. Do not taste or smell materials directly. Keep the balloon pointed away from faces. Wipe spills immediately. Wash hands after each mission. Adult supervision is required throughout.</div>
<h2>Expected evidence guide</h2><div class="card wrap"><table><tr><th>Mission</th><th>Expected evidence</th></tr>
<tr><td>1</td><td>Fair comparison with ≥3 trials; only one factor changed; salted ice typically melts faster.</td></tr>
<tr><td>2</td><td>Sunny location usually shows the greatest water loss; IV: location, DV: water remaining, controls: cup, amount, time.</td></tr>
<tr><td>3</td><td>Group A shows the greatest increase (+80); claim supported with numbers and graph.</td></tr>
<tr><td>4</td><td>Time decreases as temperature rises (12→3 min); prediction for a warmer condition is lower, justified by the trend.</td></tr>
<tr><td>5</td><td>Bubbles, balloon inflation (new gas), possible temperature change: at least two signs of chemical change.</td></tr>

<h2>Validation</h2><p class="mut">The package is designed for expert evaluation using the DepEd LRMDS Evaluation Tool: Content Quality, Instructional Quality, Technical Quality and Usability.</p>`},
rubric(){const C=[["Investigation",["Needs continuous assistance","Needs several reminders","Conducts with minor guidance","Plans and conducts independently"]],["Evidence Collection",["Evidence is incomplete","Records limited evidence","Records most evidence","Records complete and accurate evidence"]],["Data Interpretation",["Cannot yet interpret data","Some errors in interpretation","Correctly interprets most data","Correctly identifies and explains patterns"]],["Scientific Explanation",["Explanation is unclear","Explanation is incomplete","Reasonable explanation","Clear claim, evidence and reasoning"]],["Problem Solving",["Difficulty making decisions","Needs guidance","Generally appropriate decisions","Appropriate scientific decisions"]],["Reflection",["Little or no reflection","Simple reflection","Clear reflection","Explains learning and improvements"]]];

$$(".rb").forEach(s=>s.onchange=()=>{const t=$$(".rb").reduce((a,x)=>a+ +x.value,0);const l=t>=21?"Excellent":t>=16?"Good":t>=11?"Developing":t>0?"Beginning":"";$("#rs2").textContent=`Score: ${t} / 24 ${l?"· "+l:""}`})}

if(s===7)body=`<div class="note"><b>Mission question:</b> ${m.q}</div><p class="mut">Sentence frame: ${m.frame}</p>${ta("dec","Our Mission Decision")}`;
if(s===8)body=ta("ref","What did I learn?")+ta("chg","What would I change next time?");
if(s===9){const need=chk(m);body=`<h3>Earn the badge</h3><p class="mut">The whole Evidence Chain must be complete:</p>${need.map(x=>`<div>${x[1]?"✅":"⬜"} ${x[0]}</div>`).join("")}<div style="text-align:center;margin:18px"><div class="badge ${st.got?"got":""}" style="font-size:70px">${m.b}</div><b>${m.bn}</b></div><div style="text-align:center"><button class="btn" id="earn" ${need.every(x=>x[1])&&!st.got?"":"disabled"}>${st.got?"Badge earned! 🎉":"Earn badge"}</button></div>${st.got?`<div class="card" style="margin-top:14px"><h3>Evidence Card · Mission ${m.n}</h3><p><b>Question:</b> ${m.q}</p><p><b>Prediction:</b> ${fv("pred")}</p><p><b>Claim:</b> ${fv("claim")}</p><p><b>Evidence:</b> ${fv("ev")}</p><p><b>Reasoning:</b> ${fv("rea")}</p><p><b>Decision:</b> ${fv("dec")}</p><p><b>Would change:</b> ${fv("chg")}</p></div>`:""}`}
P.innerHTML=`<h2>Mission ${m.n}: ${m.t}</h2><span class="tag">${m.c}</span><div class="stages">${STAGES.map((x,i)=>`<span class="st ${i===s?"on":""}" data-i="${i}">${i+1}. ${x}</span>`).join("")}</div><div class="card">${body}</div><div class="row"><button class="btn alt" id="pv" ${s?"":"disabled"}>← Back</button><button class="btn" id="nx" ${s<9?"":"disabled"}>Next →</button></div>`;
$$(".st",P).forEach(e=>e.onclick=()=>{st.s=+e.dataset.i;save();play()});
$("#pv").onclick=()=>{st.s--;save();play()};$("#nx").onclick=()=>{st.s++;save();play();P.scrollIntoView({behavior:"smooth"})};
$$("[data-k]",P).forEach(e=>e.oninput=()=>{st.f[e.dataset.k]=e.value;save()});
$$("[data-d]",P).forEach(e=>e.oninput=()=>{st.d[e.dataset.d]=e.value;save()});
$$("[data-x]",P).forEach(e=>e.onchange=()=>{st.x[e.dataset.x]=e.checked;save()});
$$("[name=qz]",P).forEach(e=>e.onchange=()=>{st.qa=+e.value;save();play()});
if(s===5&&tb.num.length)graph(m);
const eb=$("#earn");if(eb)eb.onclick=()=>{st.got=true;save();play();burst()}}
function chk(m){const st=mm(m.n),f=st.f,n=Object.values(st.d).filter(v=>v!=="").length;
return[["Prediction written",!!f.pred],["Investigation plan completed",!!(f.p1&&f.p2&&f.p3&&f.p4)],["Data / evidence recorded",!!m.tbl.given||n>=3],["Pattern question answered correctly",st.qa===m.quiz.a],["Claim, evidence and reasoning written",!!(f.claim&&f.ev&&f.rea)],["Mission decision made",!!f.dec],["Reflection written",!!(f.ref&&f.chg)]]}
function graph(m){const tb=m.tbl,st=mm(m.n),g=$("#gr");
const val=(r,c)=>{const v=st.d[r+"_"+c]??tb.r[r][c];return v===""||v==null?NaN:+v};
const labs=tb.r.map(r=>r[tb.lab]);
const all=tb.r.flatMap((_,i)=>tb.num.map(c=>val(i,c))).filter(x=>!isNaN(x));
if(!all.length){g.innerHTML='<p class="mut">No numbers recorded yet. Go back to “Record” and enter your data to see the graph.</p>';return}
const W=640,H=280,L=44,B=40,T=14,mx=Math.max(...all)*1.1||1,cols=["#3b5bdb","#f08c00","#2b9348"];
const x=i=>L+(tb.r.length>1?i*(W-L-20)/(tb.r.length-1):(W-L)/2),y=v=>H-B-(v/mx)*(H-B-T);
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px" role="img" aria-label="Line graph of the data">`;
for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mut)">${Math.round(v)}</text>`}
tb.num.forEach((c,k)=>{const pts=tb.r.map((_,i)=>[x(i),y(val(i,c))]).filter(p=>!isNaN(p[1]));s+=`<polyline fill="none" stroke="${cols[k%3]}" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${cols[k%3]}"/>`).join("")});
labs.forEach((l,i)=>s+=`<text x="${x(i)}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="var(--mut)">${esc(String(l).slice(0,12))}</text>`);
s+="</svg><div>"+tb.num.map((c,k)=>`<span style="color:${cols[k%3]};margin-right:12px">● ${tb.h[c]}</span>`).join("")+"</div>";g.innerHTML=s}
function burst(){const e=document.createElement("div");e.style.cssText="position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;font-size:90px;z-index:20;animation:f 1.6s forwards";e.textContent="🏅🎉";const k=document.createElement("style");k.textContent="@keyframes f{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1.6);opacity:0}}";document.head.append(k);document.body.append(e);setTimeout(()=>{e.remove();k.remove()},1700)}
go("home");
</script></body></html>
